<script>
const $=id=>document.getElementById(id);
const DEF={"main.py":"# Welcome to PyIDE!\nname = input('Your name? ')\nfor i in range(3):\n    print('Hello', name, i)\n"};
let files={},cur="main.py",running=false,pendingIn=null;
var dirs=[],otabs=[],selDir="",openDirs={};
const save=()=>{try{localStorage.setItem("pyide",JSON.stringify({files,cur,d:dirs,t:document.documentElement.dataset.theme||""}));return true}catch(e){return false}};
try{const d=JSON.parse(localStorage.getItem("pyide"));if(d&&d.files){files=d.files;dirs=d.d||[];cur=d.cur in d.files?d.cur:Object.keys(d.files)[0];if(d.t)document.documentElement.dataset.theme=d.t}}catch(e){}
if(!Object.keys(files).length)files={...DEF};
const KW="False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield".split(" ");
const BI="print input len range int str float list dict set tuple open sum min max abs sorted enumerate zip map filter type isinstance round self".split(" ");
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const RX=new RegExp('(#.*)|("""[\\s\\S]*?("""|$)|\'\'\'[\\s\\S]*?(\'\'\'|$)|"(?:\\\\.|[^"\\\\\\n])*"?|\'(?:\\\\.|[^\'\\\\\\n])*\'?)|\\b(\\d+\\.?\\d*)\\b|\\b([A-Za-z_]\\w*)\\b','g');
function hi(t){let o="",l=0,m,pk="";RX.lastIndex=0;while((m=RX.exec(t))){o+=esc(t.slice(l,m.index));const x=m[0];let c="";
if(m[1])c="c";else if(m[2])c="s";else if(m[5])c="n";else if(KW.includes(x))c="k";else if(m[6]&&(pk==="def"||pk==="class"))c="f";else if(BI.includes(x))c="b";if(m[6])pk=x;
o+=c?`<span class="${c}">${esc(x)}</span>`:esc(x);l=m.index+x.length;if(!x.length)RX.lastIndex++}
return o+esc(t.slice(l))+"\n"}
function render(){const t=$("ed").value;$("hl").innerHTML=hi(t);const n=t.split("\n").length;let g="";for(let i=1;i<=n;i++)g+=(i===errLine&&errFile===cur?"●":"")+i+"\n";$("gut").textContent=g;sync()}
function sync(){const e=$("ed");$("hl").scrollTop=e.scrollTop;$("hl").scrollLeft=e.scrollLeft;$("gut").scrollTop=e.scrollTop;posErr()}
function tabs(){const t=$("tabs");t.innerHTML="";Object.keys(files).forEach(n=>{const d=document.createElement("div");d.className="tab"+(n===cur?" on":"");d.textContent=n;if(n===cur){const x=document.createElement("span");x.textContent="  ×";x.onclick=ev=>{ev.stopPropagation();$("dl").click()};d.appendChild(x)}d.onclick=()=>{files[cur]=$("ed").value;cur=n;load();save()};t.appendChild(d)})}
function load(){$("ed").value=files[cur];tabs();render()}
$("ed").addEventListener("input",()=>{files[cur]=$("ed").value;errLine=0;render();if(ST.autosave)save()});
$("ed").addEventListener("scroll",sync);
function ins(s,back){const e=$("ed");e.focus();if(!document.execCommand("insertText",false,s))e.setRangeText(s,e.selectionStart,e.selectionEnd,"end");if(back)e.selectionStart=e.selectionEnd=e.selectionStart-back;e.dispatchEvent(new Event("input"))}
const PR={"(":")","[":"]","{":"}",'"':'"',"'":"'"};
function enter(){const e=$("ed"),ln=e.value.slice(0,e.selectionStart).split("\n").pop();let ind=ln.match(/^\s*/)[0];if(/:\s*$/.test(ln))ind+=" ".repeat(ST.tab);ins("\n"+ind)}
$("ed").addEventListener("keydown",k=>{if(k.key==="Tab"){k.preventDefault();k.shiftKey?blk(dedent):tab()}});
$("ed").addEventListener("beforeinput",ev=>{const e=$("ed");if(!ev.cancelable||ev.isComposing)return;const a=e.selectionStart,b=e.selectionEnd,v=e.value,t=ev.inputType;
if(t==="insertLineBreak"||t==="insertParagraph"){ev.preventDefault();enter();return}
if(t==="insertText"&&ev.data&&ev.data.length===1){const d=ev.data;
if(ST.pairs&&a===b&&v[a]===d&&")]}\"'".includes(d)){ev.preventDefault();e.setSelectionRange(a+1,a+1);return}
if(ST.pairs&&PR[d]&&a===b){const p=v[a-1]||"";if((d==='"'||d==="'")&&/\w/.test(p))return;ev.preventDefault();ins(d+PR[d],1)}}
else if(ST.pairs&&t==="deleteContentBackward"&&a===b&&a>0&&PR[v[a-1]]===v[a]){ev.preventDefault();e.setSelectionRange(a-1,a+1);document.execCommand("delete")}});
const SY=["↶","↷","⇥","⇤","#±","(",")","[","]","{","}",":","=","\"","'","_","#",".",",","+","-","*","/","%","<",">","!","&","|"];
SY.forEach(s=>{const b=document.createElement("button");b.textContent=s;b.onmousedown=e=>e.preventDefault();b.onclick=()=>{if(s==="↶")document.execCommand("undo");else if(s==="↷")document.execCommand("redo");else if(s==="⇥")tab();else if(s==="⇤")blk(dedent);else if(s==="#±")blk(togc);else ins(s)};$("sym").appendChild(b)});
$("mn").onclick=e=>{e.stopPropagation();$("menu").classList.toggle("show")};
document.addEventListener("click",()=>$("menu").classList.remove("show"));
const out=$("out"),showOut=()=>out.classList.add("show");
$("bk").onclick=()=>{out.classList.remove("show");if(errLine&&errFile===cur)gotoLine(errLine)};
$("rr").onclick=()=>$("run").click();
$("cp2").onclick=()=>$("cp").click();
new MutationObserver(()=>{$("st3").textContent="· "+$("st").textContent}).observe($("st"),{childList:true});
$("th").onclick=()=>{const r=document.documentElement,d=r.dataset.theme==="light"?"dark":"light";r.dataset.theme=d;ST.theme=d;saveST();save()};
$("nw").onclick=()=>{let n=prompt("File name","new.py");if(!n)return;if(!n.endsWith(".py"))n+=".py";if(files[n]){alert("Already exists");return}files[n]="";cur=n;load();save()};
$("rn").onclick=()=>{let n=prompt("New name",cur);if(!n||n===cur)return;if(files[n]){alert("Already exists");return}files[n]=files[cur];delete files[cur];cur=n;load();save()};
$("dl").onclick=()=>{if(!confirm("Delete "+cur+"?"))return;delete files[cur];if(!Object.keys(files).length)files["main.py"]="";cur=Object.keys(files)[0];load();save()};
$("dn").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([files[cur]],{type:"text/plain"}));a.download=cur;a.click()};
$("up").onclick=()=>$("fi").click();
$("fi").onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{files[f.name]=t;cur=f.name;load();save()})};
let FS=14;try{FS=+localStorage.getItem("pyide_fs")||14}catch(e){}
function setFS(n){FS=Math.max(10,Math.min(24,n));document.documentElement.style.setProperty("--fs",FS+"px");if(window.posErr)posErr();try{localStorage.setItem("pyide_fs",FS)}catch(e){}}setFS(FS);
$("fm").onclick=e=>{e.stopPropagation();setFS(FS-1)};$("fp").onclick=e=>{e.stopPropagation();setFS(FS+1)};
$("cp").onclick=()=>{try{navigator.clipboard.writeText(con.innerText)}catch(e){}};
$("cl").onclick=()=>{$("con").innerHTML=""};
const con=$("con");
function w(t,cls){const s=document.createElement("span");if(cls)s.className=cls;s.textContent=t;con.appendChild(s);con.scrollTop=con.scrollHeight}
let py=null;
const PYURL="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/";
let T0=0;function setRun(r){running=r;const b=$("run");b.textContent=r?(py?"running...":"■ Stop"):"▶ Run";b.className=r&&!py?"stop":"run";$("rr").textContent=r?(py?"running...":"■ Stop"):"▶ Run again";$("st").textContent=r?"running...":"finished"}
let sk=false;
const SRC=[["https://cdnjs.cloudflare.com/ajax/libs/skulpt/1.2.0/skulpt.min.js","https://cdnjs.cloudflare.com/ajax/libs/skulpt/1.2.0/skulpt-stdlib.js"],["https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js","https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"]];
const ld=u=>new Promise((r,j)=>{const e=document.createElement("script");e.src=u;e.onload=r;e.onerror=j;document.head.appendChild(e)});
async function loadSk(){for(const [a,b] of SRC){try{await ld(a);await ld(b);if(window.Sk&&Sk.builtinFiles){sk=true;if(!py)$("st").textContent="Basic Python ready";return}}catch(e){}}$("st").textContent="engine failed";w("Koi engine load nahi hua. Internet check karke reload karo.\n","e")}
function rd(f){if(!Sk.builtinFiles||!Sk.builtinFiles.files[f])throw "File not found: '"+f+"'";return Sk.builtinFiles.files[f]}
function inp(p){return new Promise((res,rej)=>{pendingIn=rej;if(p)w(p);const i=document.createElement("input"),b=document.createElement("button");b.textContent="↵ Send";b.style.marginLeft="6px";con.appendChild(i);con.appendChild(b);i.focus();const done=()=>{const v=i.value;i.replaceWith(document.createTextNode(v+"\n"));b.remove();pendingIn=null;res(v)};i.onkeydown=e=>{if(e.key==="Enter")done()};b.onclick=done;con.scrollTop=con.scrollHeight})}

function toast(m){const t=$("ts");t.textContent=m;t.classList.add("on");clearTimeout(toast.k);toast.k=setTimeout(()=>t.classList.remove("on"),2000)}
function askBox(title,def,ph,mode){return new Promise(res=>{const m=$("md"),i=$("mi");$("mt").textContent=title;i.style.display="";i.value=def||"";i.placeholder=ph||"";i.inputMode=mode||"text";m.classList.add("show");setTimeout(()=>{i.focus();i.select()},60);
const done=v=>{m.classList.remove("show");$("mok").onclick=$("mcn").onclick=i.onkeydown=null;res(v)};$("mok").onclick=()=>done(i.value.trim());$("mcn").onclick=()=>done(null);i.onkeydown=e=>{if(e.key==="Enter")done(i.value.trim());else if(e.key==="Escape")done(null)}})}
function confirmBox(msg){return new Promise(res=>{const m=$("md");$("mt").textContent=msg;$("mi").style.display="none";const done=v=>{m.classList.remove("show");$("mok").onclick=$("mcn").onclick=null;res(v)};$("mok").onclick=()=>done(true);$("mcn").onclick=()=>done(false);m.classList.add("show")})}
const fixName=n=>{n=n.replace(/[\\/]/g,"_");return /\.\w+$/.test(n)?n:n+".py"};
$("nw").onclick=async()=>{let n=await askBox("New file","","name.py");if(!n)return;n=fixName(n);if(files[n]){toast("Ye naam pehle se hai");return}files[cur]=$("ed").value;files[n]="";cur=n;errLine=0;load();save();toast("Bani: "+n)};
$("rn").onclick=async()=>{let n=await askBox("Rename file",cur,"name.py");if(!n||n===cur)return;n=fixName(n);if(files[n]){toast("Ye naam pehle se hai");return}files[n]=$("ed").value;delete files[cur];cur=n;errLine=0;load();save();toast("Rename ho gaya")};
$("dl").onclick=async()=>{if(!await confirmBox("\""+cur+"\" delete karni hai?"))return;delete files[cur];if(!Object.keys(files).length)files["main.py"]="";cur=Object.keys(files)[0];errLine=0;load();save();toast("Delete ho gayi")};
$("sv").onclick=()=>{files[cur]=$("ed").value;toast(save()?"Save ho gaya ✓":"Save nahi ho paya (browser storage band hai)")};
$("up").onclick=()=>$("fi").click();
$("fi").onchange=async e=>{let n=0;for(const f of e.target.files){const t=await f.text();let name=(selDir?selDir+"/":"")+f.name;while(files[name])name=name.replace(/(\.\w+)?$/,"_1$1");files[name]=t;cur=name;n++}e.target.value="";if(n){errLine=0;load();save();toast(n+" file khuli")}};
$("dn").onclick=async()=>{files[cur]=$("ed").value;const data=files[cur];if(!data){toast("File khali hai");return}const bn=cur.split("/").pop(),name=bn.endsWith(".py")?bn+".txt":bn;if(window.Native&&Native.saveFile){toast(Native.saveFile(bn,data)?"Downloads/PyIDE me save: "+bn:"Save nahi ho paya");return}
try{if(window.claude&&claude.use){const d=await Promise.race([claude.use("downloads"),new Promise(x=>setTimeout(()=>x(null),4000))]);if(d){await d.save({filename:name,data});toast("Download: "+name);return}}}catch(e){if(e&&e.code==="declined")return}
try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"text/plain"}));a.download=cur;document.body.appendChild(a);a.click();a.remove();toast("Download: "+cur)}catch(e){toast("Download nahi ho paya")}};
$("cp").onclick=async()=>{const t=con.innerText;if(!t.trim()){toast("Output khali hai");return}let ok=false;try{await navigator.clipboard.writeText(t);ok=true}catch(e){}
if(!ok){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{ok=document.execCommand("copy")}catch(e){}a.remove()}toast(ok?"Output copy hua ✓":"Copy nahi ho paya")};
$("gl").onclick=async()=>{const v=await askBox("Go to line","","Line number","numeric");const n=parseInt(v,10);if(!n)return;gotoLine(n);$("ed").focus();toast("Line "+Math.min(n,$("ed").value.split("\n").length))};
$("pp").onclick=async()=>{if(!py){toast(window.Native?"Package install Step 6C me aayega":"Package install ke liye full Python chahiye (Chrome me kholo)");return}const n=await askBox("Install package","","e.g. requests, sympy");if(!n)return;showOut();con.innerHTML="";w("Installing "+n+"...\n");$("st").textContent="pip...";
try{await py.loadPackage("micropip");await py.runPythonAsync("import micropip\nawait micropip.install('"+n.replace(/[^\w.\-\[\]=<>]/g,"")+"')");w("Installed: "+n+" ✓\n")}catch(e){w("Install fail: "+String(e.message||e).split("\n").slice(-2).join(" ")+"\n","e")}$("st").textContent="ready"};

function tabs(){if(!otabs.includes(cur))otabs.push(cur);otabs=otabs.filter(n=>n in files);const t=$("tabs");t.innerHTML="";
otabs.forEach(n=>{const d=document.createElement("div");d.className="tab"+(n===cur?" on":"");const l=document.createElement("span");l.textContent=n.split("/").pop();d.appendChild(l);
const x=document.createElement("span");x.textContent="  ×";x.onclick=ev=>{ev.stopPropagation();closeTab(n)};d.appendChild(x);d.onclick=()=>{files[cur]=$("ed").value;cur=n;errLine=0;load();save()};t.appendChild(d)})}
function closeTab(n){const i=otabs.indexOf(n);otabs.splice(i,1);if(n===cur){files[cur]=$("ed").value;cur=otabs[Math.max(0,i-1)]||Object.keys(files)[0]||"main.py";if(!(cur in files))files[cur]=""}errLine=0;load();save()}
function allDirs(){const s=new Set(dirs);Object.keys(files).forEach(f=>{const p=f.split("/");for(let i=1;i<p.length;i++)s.add(p.slice(0,i).join("/"))});return[...s]}
function reveal(p){const a=p.split("/");for(let i=1;i<a.length;i++)openDirs[a.slice(0,i).join("/")]=true}
const norm=n=>n.replace(/\\/g,"/").split("/").filter(p=>p&&p!=="."&&p!=="..").join("/");
const withExt=p=>{const a=p.split("/"),l=a.pop();return[...a,/\.\w+$/.test(l)?l:l+".py"].join("/")};
function choose(title,items){return new Promise(res=>{const m=$("md"),b=$("mb"),keep=b.innerHTML;$("mt").textContent=title;$("mi").style.display="none";b.innerHTML="";b.style.flexDirection="column";
const done=v=>{m.classList.remove("show");b.innerHTML=keep;b.style.flexDirection="";res(v)};
items.forEach((t,i)=>{const x=document.createElement("button");x.textContent=t;x.style.textAlign="left";x.onclick=()=>done(i);b.appendChild(x)});
const c=document.createElement("button");c.textContent="Cancel";c.onclick=()=>done(-1);b.appendChild(c);m.classList.add("show")})}
function drawTree(){const L=$("fl");L.innerHTML="";$("floc").textContent="📍 Naya file/folder yahan banega: /"+selDir;const D=allDirs();
const rt=document.createElement("div");rt.className="fr"+(selDir===""?" on":"");rt.innerHTML='<span class="nm">🏠 root (/)</span>';rt.onclick=()=>{selDir="";drawTree()};L.appendChild(rt);
const depthOf=p=>p?p.split("/").length:0;
function level(pre,dp){const inD=x=>depthOf(x)===dp+1&&(!pre||x.startsWith(pre+"/"));
D.filter(inD).sort().forEach(d=>{row("d",d,dp);if(openDirs[d])level(d,dp+1)});Object.keys(files).filter(inD).sort().forEach(f=>row("f",f,dp))}
function row(k,p,dp){const r=document.createElement("div");r.className="fr"+((k==="f"&&p===cur)||(k==="d"&&p===selDir)?" on":"");r.style.paddingLeft=(10+dp*16)+"px";
const nm=document.createElement("span");nm.className="nm";nm.textContent=(k==="d"?(openDirs[p]?"📂 ":"📁 "):(/\.py$/.test(p)?"🐍 ":"📄 "))+p.split("/").pop();r.appendChild(nm);
const mb=document.createElement("button");mb.textContent="⋮";mb.onclick=e=>{e.stopPropagation();rowMenu(k,p)};r.appendChild(mb);
r.onclick=()=>{if(k==="d"){openDirs[p]=!openDirs[p];selDir=p;drawTree()}else openFile(p)};L.appendChild(r)}
level("",0);if(!Object.keys(files).length&&!D.length){const e=document.createElement("div");e.className="fr";e.textContent="Koi file nahi";L.appendChild(e)}}
function openFile(p){files[cur]=$("ed").value;cur=p;selDir=p.split("/").slice(0,-1).join("/");reveal(p);errLine=0;load();save();closeDrawer()}
const openDrawer=()=>{files[cur]=$("ed").value;reveal(cur);drawTree();$("dw").classList.add("show")},closeDrawer=()=>$("dw").classList.remove("show");
async function newFile(dir){let n=await askBox("New file"+(dir?" in /"+dir:""),"","name.py");if(!n)return;n=norm(n);if(!n)return;n=withExt(dir?dir+"/"+n:n);if(n in files){toast("Ye file pehle se hai");return}
files[cur]=$("ed").value;files[n]="";reveal(n);selDir=n.split("/").slice(0,-1).join("/");cur=n;errLine=0;load();save();drawTree();closeDrawer();toast("Bani: "+n)}
async function newFolder(dir){let n=await askBox("New folder"+(dir?" in /"+dir:""),"","folder name");if(!n)return;n=norm(n);if(!n)return;const p=dir?dir+"/"+n:n;if(allDirs().includes(p)||p in files){toast("Ye naam pehle se hai");return}dirs.push(p);reveal(p+"/x");selDir=p;save();drawTree();toast("Folder bana: "+p)}
async function renamePath(p,isDir){let n=await askBox("Rename",p,"naya naam");if(!n)return;n=norm(n);if(!n||n===p)return;if(!isDir)n=withExt(n);
if(n in files||allDirs().includes(n)){toast("Ye naam pehle se hai");return}files[cur]=$("ed").value;
if(isDir){if(n.startsWith(p+"/")){toast("Folder apne andar nahi ja sakta");return}const mv=k=>k===p||k.startsWith(p+"/")?n+k.slice(p.length):k;
const nf={};Object.keys(files).forEach(k=>{nf[mv(k)]=files[k]});files=nf;dirs=dirs.map(mv);otabs=otabs.map(mv);cur=mv(cur);selDir=mv(selDir);const od={};Object.keys(openDirs).forEach(k=>{od[mv(k)]=openDirs[k]});openDirs=od;reveal(n+"/x")}
else{files[n]=files[p];delete files[p];otabs=otabs.map(k=>k===p?n:k);if(cur===p)cur=n;reveal(n)}
errLine=0;load();save();drawTree();toast("Rename ho gaya")}
async function deletePath(p,isDir){const ks=isDir?Object.keys(files).filter(k=>k.startsWith(p+"/")):[p];
if(!await confirmBox(isDir?"Folder \""+p+"\" aur uski "+ks.length+" files delete karni hain?":"\""+p+"\" delete karni hai?"))return;
files[cur]=$("ed").value;ks.forEach(k=>delete files[k]);if(isDir){dirs=dirs.filter(d=>d!==p&&!d.startsWith(p+"/"));if(selDir===p||selDir.startsWith(p+"/"))selDir=""}
otabs=otabs.filter(k=>k in files);if(!(cur in files)){cur=otabs[0]||Object.keys(files)[0];if(!cur){cur="main.py";files[cur]=""}}
errLine=0;load();save();drawTree();toast("Delete ho gaya")}
async function rowMenu(k,p){files[cur]=$("ed").value;const it=k==="d"?["📄 New file here","📁 New folder here","✏️ Rename","🗑 Delete"]:["✏️ Rename","📋 Duplicate","🗑 Delete"];
const i=await choose((k==="d"?"📁 ":"📄 ")+p,it);if(i<0)return;const a=it[i];
if(a.includes("New file"))newFile(p);else if(a.includes("New folder"))newFolder(p);else if(a.includes("Rename"))renamePath(p,k==="d");
else if(a.includes("Duplicate")){let n=p.replace(/(\.\w+)?$/,"_copy$1");while(n in files)n=n.replace(/(\.\w+)?$/,"_1$1");files[n]=files[p];save();reveal(n);drawTree();toast("Copy bani: "+n)}else deletePath(p,k==="d")}
