name: Build PyIDE APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Create Android project
        run: |
          set -e
          test -f index.html || { echo "ERROR: index.html repo ke root me upload karo"; exit 1; }
          mkdir -p app/src/main/java/com/pyide/app app/src/main/python app/src/main/assets app/src/main/res/drawable
          cp index.html app/src/main/assets/index.html

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "PyIDE"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.9.1' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
              id 'com.chaquo.python' version '17.0.0' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
              id 'com.chaquo.python'
          }
          android {
              namespace 'com.pyide.app'
              compileSdk 35
              defaultConfig {
                  applicationId "com.pyide.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
                 "armeabi-v7a" ndk { abiFilters "arm64-v8a", "armeabi-v7a" }
                  python { version "3.12" }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:name="com.chaquo.python.android.PyApplication"
                  android:label="PyIDE"
                  android:icon="@drawable/ic"
                  android:allowBackup="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout|density|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/drawable/ic.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#0F1419" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#3DDC97" android:pathData="M30,32h30a10,10 0 0 1 10,10v8h-24v6h30v12a10,10 0 0 1 -10,10h-30z"/>
          </vector>
          EOF

          cat > app/src/main/python/runner.py <<'EOF'
          import sys, os, json, builtins, traceback, threading, ctypes

          _tid = None


          class _W:
              def __init__(self, b, k):
                  self.b = b
                  self.k = k

              def write(self, s):
                  if s:
                      self.b.out(self.k, s)
                  return len(s)

              def flush(self):
                  pass

              def isatty(self):
                  return False


          def run(files_json, main, workdir, bridge):
              global _tid
              _tid = threading.get_ident()
              files = json.loads(files_json)
              for name, text in files.items():
                  p = os.path.join(workdir, name)
                  os.makedirs(os.path.dirname(p), exist_ok=True)
                  with open(p, "w", encoding="utf-8") as f:
                      f.write(text)
              os.chdir(workdir)
              if workdir not in sys.path:
                  sys.path.insert(0, workdir)
              sys.stdout = _W(bridge, "o")
              sys.stderr = _W(bridge, "e")

              def _inp(prompt=""):
                  if prompt:
                      bridge.out("o", str(prompt))
                  r = bridge.askInput()
                  if r is None:
                      raise KeyboardInterrupt()
                  return r

              builtins.input = _inp
              g = {"__name__": "__main__", "__file__": os.path.join(workdir, main)}
              try:
                  exec(compile(files[main], "<exec>", "exec"), g)
              except KeyboardInterrupt:
                  bridge.out("e", "\n[Stopped]\n")
              except SystemExit:
                  pass
              except BaseException:
                  lines = traceback.format_exc().split("\n")
                  k = [i for i, l in enumerate(lines) if '"<exec>"' in l]
                  if k:
                      out = "\n".join(["Traceback (most recent call last):"] + lines[k[0]:])
                  else:
                      out = "\n".join(lines)
                  bridge.out("e", out + "\n")
              finally:
                  _tid = None
                  sys.stdout = sys.__stdout__
                  sys.stderr = sys.__stderr__


          def stop():
              if _tid:
                  ctypes.pythonapi.PyThreadState_SetAsyncExc(
                      ctypes.c_ulong(_tid), ctypes.py_object(KeyboardInterrupt))
          EOF

          cat > app/src/main/java/com/pyide/app/MainActivity.kt <<'EOF'
          package com.pyide.app

          import android.annotation.SuppressLint
          import android.app.Activity
          import android.content.ContentValues
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.provider.MediaStore
          import android.webkit.JavascriptInterface
          import android.webkit.ValueCallback
          import android.webkit.WebChromeClient
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import com.chaquo.python.Python
          import org.json.JSONObject
          import java.io.File
          import java.util.concurrent.LinkedBlockingQueue

          class MainActivity : Activity() {
              private lateinit var web: WebView
              private val inq = LinkedBlockingQueue<String>()
              private var worker: Thread? = null
              private var chooser: ValueCallback<Array<Uri>>? = null

              private fun js(code: String) {
                  web.post { web.evaluateJavascript(code, null) }
              }

              inner class Bridge {
                  fun out(kind: String, text: String) {
                      js("window.onNativeOut&&onNativeOut(" + JSONObject.quote(kind) + "," + JSONObject.quote(text) + ")")
                  }

                  fun askInput(): String? {
                      js("window.onNativeInput&&onNativeInput()")
                      val r = inq.take()
                      return if (r == "\u0000STOP") null else r
                  }
              }

              inner class Native {
                  @JavascriptInterface
                  fun isNative(): Boolean = true

                  @JavascriptInterface
                  fun run(files: String, main: String) {
                      if (worker?.isAlive == true) return
                      inq.clear()
                      worker = Thread {
                          try {
                              Python.getInstance().getModule("runner")
                                  .callAttr("run", files, main, File(filesDir, "proj").absolutePath, Bridge())
                          } catch (e: Throwable) {
                              Bridge().out("e", "App error: " + e.toString() + "\n")
                          }
                          js("window.onNativeDone&&onNativeDone()")
                      }.also { it.start() }
                  }

                  @JavascriptInterface
                  fun stop() {
                      try {
                          Python.getInstance().getModule("runner").callAttr("stop")
                      } catch (e: Throwable) {
                      }
                      inq.offer("\u0000STOP")
                  }

                  @JavascriptInterface
                  fun sendInput(s: String) {
                      inq.offer(s)
                  }

                  @JavascriptInterface
                  fun saveFile(name: String, text: String): Boolean {
                      return try {
                          if (Build.VERSION.SDK_INT >= 29) {
                              val cv = ContentValues()
                              cv.put(MediaStore.Downloads.DISPLAY_NAME, name)
                              cv.put(MediaStore.Downloads.MIME_TYPE, "text/plain")
                              cv.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/PyIDE")
                              val uri = contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, cv)!!
                              contentResolver.openOutputStream(uri)!!.use { it.write(text.toByteArray()) }
                          } else {
                              File(getExternalFilesDir(null), name).writeText(text)
                          }
                          true
                      } catch (e: Throwable) {
                          false
                      }
                  }
              }

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  web = WebView(this)
                  setContentView(web)
                  web.settings.javaScriptEnabled = true
                  web.settings.domStorageEnabled = true
                  web.settings.allowFileAccess = true
                  web.addJavascriptInterface(Native(), "Native")
                  web.webViewClient = WebViewClient()
                  web.webChromeClient = object : WebChromeClient() {
                      override fun onShowFileChooser(
                          webView: WebView?,
                          filePathCallback: ValueCallback<Array<Uri>>?,
                          fileChooserParams: FileChooserParams?
                      ): Boolean {
                          chooser?.onReceiveValue(null)
                          chooser = filePathCallback
                          val i = Intent(Intent.ACTION_GET_CONTENT)
                          i.addCategory(Intent.CATEGORY_OPENABLE)
                          i.type = "*/*"
                          i.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true)
                          startActivityForResult(Intent.createChooser(i, "Open"), 7)
                          return true
                      }
                  }
                  web.loadUrl("file:///android_asset/index.html")
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  if (requestCode == 7) {
                      var r: Array<Uri>? = null
                      if (resultCode == RESULT_OK && data != null) {
                          val cd = data.clipData
                          r = if (cd != null) {
                              Array(cd.itemCount) { cd.getItemAt(it).uri }
                          } else {
                              data.data?.let { arrayOf(it) }
                          }
                      }
                      chooser?.onReceiveValue(r)
                      chooser = null
                  } else {
                      super.onActivityResult(requestCode, resultCode, data)
                  }
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  web.evaluateJavascript("(window.onNativeBack&&onNativeBack())||false") { r ->
                      if (r != "true") finish()
                  }
              }
          }
          EOF

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: PyIDE-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PyIDE build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
